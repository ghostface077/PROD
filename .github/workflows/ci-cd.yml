name: CI/CD

# Le flux normal est : push staging -> CI -> staging -> approbation -> production.
# L'approbation est fournie par l'environnement GitHub "production".
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Backend — tests (pytest)
    runs-on: ubuntu-latest
    # Les tests tournent sur SQLite en mémoire (voir tests/conftest.py) : pas
    # besoin d'un service Postgres ici, juste des variables d'environnement
    # minimales pour que Settings (app/config.py) puisse s'instancier.
    env:
      SECRET_KEY: ci_test_secret_key_do_not_use_in_production_0000000000
      ENVIRONMENT: test
      BACKEND_CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Exécuter la suite de tests
        working-directory: backend
        env:
          UPLOAD_DIR: /tmp/uploads
        run: pytest -q

  frontend-build:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérification des types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de production
        working-directory: frontend
        # Valeur factice suffisante ici : NEXT_PUBLIC_API_URL n'est utilisée au
        # build que pour être figée dans le bundle JS, aucun appel réseau réel
        # n'est fait pendant `next build`.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build

  compose-build:
    name: Docker Compose — build et configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer l'environnement de build Compose
        run: cp .env.example .env.production

      - name: Vérifier la configuration de production
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config

      - name: Construire les images Docker
        run: docker compose -f docker-compose.prod.yml --env-file .env.example build

  deploy-staging:
    name: Déploiement — staging Ubuntu
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, compose-build]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY est vide ou indisponible dans l'environnement staging" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "SSH_PRIVATE_KEY n'est pas une clé privée OpenSSH valide" >&2; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Vérifier la connexion SSH
        run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "true"

      - name: Déployer avec Docker Compose
        run: |
          tar --exclude=.git -czf - . | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"
          printf '%s\n' "$DEPLOY_ENV_FILE" | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.production'"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans && curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost/api/health"

  deploy-production:
    name: Déploiement — production Ubuntu
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY est vide ou indisponible dans l'environnement production" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "SSH_PRIVATE_KEY n'est pas une clé privée OpenSSH valide" >&2; exit 1; }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Vérifier la connexion SSH
        run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "true"

      - name: Déployer avec Docker Compose
        run: |
          tar --exclude=.git -czf - . | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"
          printf '%s\n' "$DEPLOY_ENV_FILE" | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/.env.production'"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans && curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost/api/health"

      - name: Publier le commit approuvé dans PROD
        env:
          PROD_REPO_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          PROD_REPOSITORY: ${{ vars.PROD_REPOSITORY }}
        run: | 
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add prod "https://x-access-token:${PROD_REPO_TOKEN}@github.com/${PROD_REPOSITORY}.git"
          git push prod HEAD:main
